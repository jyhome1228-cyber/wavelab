<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AESOST</title><desc id="desc">보라색과 검정 배경 위 에이소스트 심볼과 로고</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17151C"/><stop offset="1" stop-color="#241133"/></linearGradient><linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9D5FF"/><stop offset=".45" stop-color="#8B5CF6"/><stop offset="1" stop-color="#661BDD"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="35"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="915" cy="180" r="190" fill="#661BDD" opacity=".22" filter="url(#glow)"/><g transform="translate(112 140)"><g transform="translate(0 24)"><rect x="38" y="0" width="78" height="208" rx="39" transform="rotate(27 38 0)" fill="url(#mark)"/><circle cx="155" cy="178" r="34" fill="#8B5CF6"/></g><text x="255" y="132" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" letter-spacing="-4">AESOST</text><text x="260" y="205" fill="#B8AFBF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">혼자 나아가는 사람들의 질문과 경험을 연결합니다.</text></g><g transform="translate(112 500)"><rect width="410" height="2" fill="#661BDD"/><text y="44" fill="#8B5CF6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">ASK · LEARN · WRITE · MOVE</text></g></svg>