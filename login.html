<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 — AESOST</title>
  <meta name="description" content="에이소스트에 로그인하고 저장한 콘텐츠와 커리어 기록을 확인하세요.">
  <link rel="stylesheet" href="styles.css?v=20260802-5">
  <link rel="stylesheet" href="aesost-theme.css?v=20260804-3">
  <link rel="stylesheet" href="auth-aesost.css?v=20260805-1">
</head>
<body class="auth-page">
  <header class="site-header" data-header></header>
  <main class="auth-main shell">
    <section class="auth-card">
      <div class="auth-visual" aria-hidden="true"><img src="aesost-symbol-3d.svg?v=20260802-1" alt=""></div>
      <a class="auth-brand" href="index.html" aria-label="AESOST 홈으로 이동"><img class="brand-logo" src="aesost-logo.svg?v=20260801-2" alt="AESOST"></a>
      <div class="auth-tabs"><button class="is-active" type="button" data-auth-tab="login">로그인</button><button type="button" data-auth-tab="signup">회원가입</button></div>
      <div class="auth-panel is-active" data-auth-panel="login">
        <h1>다시 만나 반가워요.</h1><p>저장한 콘텐츠와 커리어 기록을 이어서 확인하세요.</p>
        <div class="social-login"><button type="button" data-google-login><span data-google-label>Google로 계속하기</span></button></div>
        <div class="auth-divider"><span>또는 이메일로 로그인</span></div>
        <form class="auth-form" data-login-form>
          <label><span>이메일</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required></label>
          <label><span>비밀번호</span><input type="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required></label>
          <div class="auth-options"><label><input type="checkbox" name="remember"> 로그인 상태 유지</label><a href="#" data-reset-password>비밀번호 찾기</a></div>
          <button class="auth-submit" type="submit">로그인</button>
        </form>
      </div>
      <div class="auth-panel" data-auth-panel="signup">
        <h1>에이소스트를 시작해 보세요.</h1><p>지식을 얻고, 관점을 기록하며, 자신의 커리어 자산을 쌓아보세요.</p>
        <div class="social-login"><button type="button" data-google-login><span data-google-label>Google로 시작하기</span></button></div>
        <div class="auth-divider"><span>또는 이메일로 가입</span></div>
        <form class="auth-form" data-signup-form>
          <label><span>이름</span><input type="text" name="name" placeholder="이름을 입력해 주세요" autocomplete="name" required></label>
          <label><span>이메일</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required></label>
          <label><span>비밀번호</span><input type="password" name="password" placeholder="6자 이상 입력해 주세요" autocomplete="new-password" minlength="6" required></label>
          <label class="agreement"><input type="checkbox" name="agreement" required>이용약관과 개인정보처리방침에 동의합니다.</label>
          <button class="auth-submit" type="submit">회원가입</button>
        </form>
      </div>
      <p class="auth-notice" data-auth-notice>로그인 정보를 입력해 주세요.</p>
    </section>
  </main>
  <footer class="footer" data-footer></footer>
  <script src="script.js?v=20260805-1"></script>
  <script>
    (() => {
      const card = document.querySelector('.auth-card');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      if (!card || reducedMotion || coarsePointer) return;

      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;

      const renderGlow = () => {
        const rect = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(100, ((pointerX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((pointerY - rect.top) / rect.height) * 100));
        card.style.setProperty('--mouse-x', `${x}%`);
        card.style.setProperty('--mouse-y', `${y}%`);
        frame = 0;
      };

      card.addEventListener('pointerenter', () => card.classList.add('is-pointer-active'));
      card.addEventListener('pointermove', event => {
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (!frame) frame = requestAnimationFrame(renderGlow);
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-pointer-active');
        card.style.setProperty('--mouse-x', '50%');
        card.style.setProperty('--mouse-y', '18%');
      });
    })();
  </script>
</body>
</html>
