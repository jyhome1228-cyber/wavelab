name: Correct That Joe image assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-that-joe-avif.yml'
      - 'scripts/fix-that-joe-avif.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct image extensions and page references
        run: node scripts/fix-that-joe-avif.mjs

      - name: Commit corrected assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reference/that-joe reference-that-joe-pizza.html reference.html reference-source-images.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use correctly named local AVIF project images"
            git push
          fi
