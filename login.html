<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 — WAVELAB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <header class="site-header" data-header></header>
  <main class="auth-main shell">
    <section class="auth-card">
      <a class="auth-brand" href="index.html"><span>✦</span><strong>WAVELAB</strong></a>
      <div class="auth-tabs">
        <button class="is-active" type="button" data-auth-tab="login">로그인</button>
        <button type="button" data-auth-tab="signup">회원가입</button>
      </div>
      <div class="auth-panel is-active" data-auth-panel="login">
        <h1>다시 만나 반가워요.</h1>
        <p>저장한 콘텐츠와 스터디 정보를 확인하려면 로그인해 주세요.</p>
        <form class="auth-form" data-demo-auth>
          <label><span>이메일</span><input type="email" placeholder="name@example.com" required></label>
          <label><span>비밀번호</span><input type="password" placeholder="비밀번호를 입력해 주세요" required></label>
          <div class="auth-options"><label><input type="checkbox"> 로그인 상태 유지</label><a href="#">비밀번호 찾기</a></div>
          <button class="auth-submit" type="submit">로그인</button>
        </form>
        <div class="auth-divider"><span>또는</span></div>
        <div class="social-login"><button type="button">Google로 계속하기</button><button type="button">Kakao로 계속하기</button></div>
      </div>
      <div class="auth-panel" data-auth-panel="signup">
        <h1>웨이블랩을 시작해 보세요.</h1>
        <p>관심 콘텐츠를 저장하고 새로운 스터디 소식을 받아보세요.</p>
        <form class="auth-form" data-demo-auth>
          <label><span>이름</span><input type="text" placeholder="이름을 입력해 주세요" required></label>
          <label><span>이메일</span><input type="email" placeholder="name@example.com" required></label>
          <label><span>비밀번호</span><input type="password" placeholder="8자 이상 입력해 주세요" required></label>
          <label class="agreement"><input type="checkbox" required> 이용약관과 개인정보처리방침에 동의합니다.</label>
          <button class="auth-submit" type="submit">회원가입</button>
        </form>
      </div>
      <p class="auth-notice" data-auth-notice>현재는 UI 확인용 화면이며 실제 인증은 Firebase 연결 단계에서 활성화됩니다.</p>
    </section>
  </main>
  <footer class="footer" data-footer></footer>
  <script src="script.js"></script>
</body>
</html>
