="#8F8F97" font-size="13">Up to 10 people</text><text x="446" y="522" fill="#8B5CF6" font-size="12">02 / TIME</text><text x="446" y="561" fill="#FFFFFF" font-size="20" font-weight="600">Two Sessions</text><text x="446" y="594" fill="#8F8F97" font-size="13">10–15 / 16–21</text><text x="835" y="522" fill="#8B5CF6" font-size="12">03 / BOOKING</text><text x="835" y="561" fill="#FFFFFF" font-size="20" font-weight="600">Simple Flow</text><text x="835" y="594" fill="#8F8F97" font-size="13">Info → Select → Reserve</text></g><defs><linearGradient id="g" x1="34" y1="106" x2="1166" y2="462" gradientUnits="userSpaceOnUse"><stop stop-color="#1B1B1E"/><stop offset=".55" stop-color="#131316"/><stop offset="1" stop-color="#1A1621"/></linearGradient></defs></svg>