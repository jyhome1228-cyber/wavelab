name: Fetch Design article 165225

on:
  push:
    branches:
      - agent/magazine-design-165225
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-article:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Design+ article
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html import unescape

          headers = {"User-Agent": "Mozilla/5.0 (Wavelab editorial research)"}
          urls = [
              "https://design.co.kr/wp-json/wp/v2/posts/165225?_embed=1",
              "https://design.co.kr/article/165225/",
          ]

          for url in urls:
              print(f"===== FETCH {url} =====")
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as res:
                      raw = res.read().decode("utf-8", errors="replace")
                      print("STATUS", res.status)
                      print("FINAL_URL", res.geturl())
                      print("CONTENT_TYPE", res.headers.get("content-type"))
                      print("LENGTH", len(raw))
                      print(raw[:120000])
              except Exception as exc:
                  print("ERROR", repr(exc))
          PY
