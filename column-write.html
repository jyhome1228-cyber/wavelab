<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칼럼 작성 — WAVELAB</title><meta name="description" content="WAVELAB 칼럼 작성 및 수정"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="column-system.css"></head><body><header class="site-header" data-header></header><main class="column-form-page shell"><section class="column-form-head"><p>WRITE A COLUMN</p><h1 data-write-title>새 칼럼 작성</h1><span>임시저장한 뒤 검토를 요청할 수 있습니다. 제목, 요약, 대표이미지와 본문을 작성해 주세요.</span></section><form class="column-form" data-column-form hidden><div class="column-form-row"><label><span>카테고리</span><select name="category" required><option value="디자인">디자인</option><option value="브랜딩">브랜딩</option><option value="기획">기획</option><option value="개발">개발</option><option value="커리어">커리어</option><option value="AI·테크">AI·테크</option><option value="비즈니스">비즈니스</option><option value="라이프">라이프</option></select></label><label><span>대표이미지 URL</span><input name="thumbnailUrl" type="url" placeholder="https://"></label></div><label><span>제목</span><input name="title" maxlength="120" required></label><label><span>한 줄 요약</span><textarea name="summary" maxlength="300" required></textarea></label><label><span>본문</span><textarea name="content" placeholder="문단 사이를 한 줄 비워 작성해 주세요." required></textarea></label><div class="column-form-actions"><a href="mypage.html#columns">취소</a><button type="button" data-save-draft>임시저장</button><button class="primary" type="submit">검토 요청</button></div><p class="column-notice" data-column-notice></p></form><section class="column-status" data-column-write-status><strong>작성 권한을 확인하고 있습니다.</strong></section></main><footer class="footer" data-footer></footer><script src="script.js"></script><script type="module" src="column-write.js"></script></body></html>
