name: Sync global UI assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-global-ui.yml'
      - 'scripts/sync-global-ui.mjs'
      - 'script.js'
      - 'aesost-theme.css'
      - 'reference.css'
      - 'reference-save.css'
      - 'reference-save.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync shared header and theme versions
        run: node scripts/sync-global-ui.mjs

      - name: Commit synced pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' script.js
          if git diff --cached --quiet; then
            echo "No shared UI files needed updating"
          else
            git commit -m "Sync global header across all pages"
            git push
          fi