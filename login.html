<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>로그인 | AESOST</title>
  <meta name="description" content="AESOST 계정 로그인 페이지입니다.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg?v=20260803-4" type="image/svg+xml">
  <link rel="stylesheet" href="dev-site.css?v=20260906-2">
  <link rel="stylesheet" href="dev-visual-refine.css?v=20260906-1">
  <link rel="stylesheet" href="login-current.css?v=20260907-1">
</head>
<body class="auth-page">
  <header class="dev-header" data-dev-header></header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-head">
        <a class="auth-brand" href="index.html" aria-label="AESOST 홈으로 이동">
          <img src="aesost-logo-dark.svg?v=20260907-1" alt="AESOST">
        </a>
        <span class="auth-context" data-auth-context>ACCOUNT</span>
      </div>

      <div class="auth-admin-note" data-admin-note>
        AESOST 관리자 콘솔 접근을 위한 로그인입니다. 관리자 권한이 있는 계정으로 로그인해 주세요.
      </div>

      <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
        <button class="is-active" type="button" data-auth-tab="login" role="tab" aria-selected="true">로그인</button>
        <button type="button" data-auth-tab="signup" role="tab" aria-selected="false">회원가입</button>
      </div>

      <div class="auth-panel is-active" data-auth-panel="login">
        <h1 id="auth-title" data-login-title>로그인</h1>
        <p data-login-copy>AESOST 계정으로 로그인해 주세요.</p>

        <form class="auth-form" data-login-form>
          <label>
            <span>이메일</span>
            <input type="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </label>
          <label>
            <span>비밀번호</span>
            <input type="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required>
          </label>
          <div class="auth-options">
            <label><input type="checkbox" name="remember"> 로그인 상태 유지</label>
            <a href="#" data-reset-password>비밀번호 찾기</a>
          </div>
          <button class="auth-submit" type="submit">로그인</button>
        </form>

        <div class="auth-divider"><span>또는</span></div>
        <div class="social-login">
          <button type="button" data-google-login>
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.963 10.706A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
              <path fill="#EA4335" d="M9 3.58c1.322 0 2.507.455 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
            </svg>
            <span data-google-label>Google로 계속하기</span>
          </button>
        </div>
      </div>

      <div class="auth-panel" data-auth-panel="signup">
        <h1>계정 만들기</h1>
        <p>AESOST 계정을 생성합니다.</p>

        <form class="auth-form" data-signup-form>
          <label><span>이름</span><input type="text" name="name" placeholder="이름을 입력해 주세요" autocomplete="name" required></label>
          <label><span>이메일</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required></label>
          <label><span>비밀번호</span><input type="password" name="password" placeholder="6자 이상 입력해 주세요" autocomplete="new-password" minlength="6" required></label>
          <label class="agreement"><input type="checkbox" name="agreement" required>이용약관과 개인정보처리방침에 동의합니다.</label>
          <button class="auth-submit" type="submit">회원가입</button>
        </form>

        <div class="auth-divider"><span>또는</span></div>
        <div class="social-login">
          <button type="button" data-google-login>
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.963 10.706A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
              <path fill="#EA4335" d="M9 3.58c1.322 0 2.507.455 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
            </svg>
            <span data-google-label>Google로 시작하기</span>
          </button>
        </div>
      </div>

      <p class="auth-notice" data-auth-notice>로그인 정보를 입력해 주세요.</p>
    </section>
  </main>

  <footer class="dev-footer" data-dev-footer></footer>

  <script src="dev-shell.js?v=20260907-4"></script>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const next=params.get('next')||'';
      const adminMode=next==='admin/'||next==='admin'||next.startsWith('admin/');
      const body=document.body;
      const activate=name=>{
        document.querySelectorAll('[data-auth-tab]').forEach(tab=>{
          const active=tab.dataset.authTab===name;
          tab.classList.toggle('is-active',active);
          tab.setAttribute('aria-selected',String(active));
        });
        document.querySelectorAll('[data-auth-panel]').forEach(panel=>panel.classList.toggle('is-active',panel.dataset.authPanel===name));
      };
      document.querySelectorAll('[data-auth-tab]').forEach(tab=>tab.addEventListener('click',()=>activate(tab.dataset.authTab)));
      if(adminMode){
        body.classList.add('is-admin-login');
        document.querySelector('[data-auth-context]').textContent='ADMIN ACCESS';
        document.querySelector('[data-login-title]').textContent='관리자 로그인';
        document.querySelector('[data-login-copy]').textContent='AESOST 운영 콘솔에 접근합니다.';
        document.title='관리자 로그인 | AESOST';
        activate('login');
      }else if(params.get('mode')==='signup'||location.hash==='#signup'){
        activate('signup');
      }
    })();
  </script>
  <script type="module" src="firebase-auth.js?v=20260907-1"></script>
</body>
</html>
