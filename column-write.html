<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칼럼 작성 — WAVELAB</title><meta name="description" content="WAVELAB 인증 칼럼니스트 전용 칼럼 작성 및 수정"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="column-system.css"><link rel="stylesheet" href="column-editor.css"></head><body><header class="site-header" data-header></header><main class="column-form-page shell"><section class="column-form-head"><p>WRITE A COLUMN</p><h1 data-write-title>새 칼럼 작성</h1><span>WAVELAB 인증 칼럼니스트만 작성할 수 있습니다. 임시저장 후 에디토리얼 검토를 요청해 주세요.</span></section><form class="column-form" data-column-form hidden><div class="column-form-row"><label><span>카테고리</span><select name="category" required><option value="디자인">디자인</option><option value="브랜딩">브랜딩</option><option value="기획">기획</option><option value="개발">개발</option><option value="커리어">커리어</option><option value="AI·테크">AI·테크</option><option value="비즈니스">비즈니스</option><option value="라이프">라이프</option></select></label><label><span>대표이미지 URL</span><input name="thumbnailUrl" type="url" placeholder="https://"></label></div><label><span>제목</span><input name="title" maxlength="120" required></label><label><span>한 줄 요약</span><textarea name="summary" maxlength="300" required></textarea></label><div><span style="display:block;margin-bottom:9px;font-size:13px;font-weight:700">본문</span><div class="column-editor-wrap"><div class="column-editor-toolbar" data-editor-toolbar><select data-format-block aria-label="문단 스타일"><option value="p">본문</option><option value="h2">큰 제목</option><option value="h3">작은 제목</option><option value="blockquote">인용문</option></select><button type="button" data-command="bold"><b>B</b></button><button type="button" data-command="italic"><i>I</i></button><button type="button" data-command="underline"><u>U</u></button><button type="button" data-command="insertUnorderedList">목록</button><button type="button" data-command="insertOrderedList">번호</button><button type="button" data-command="createLink">링크</button><button type="button" data-align="left">좌측</button><button type="button" data-align="center">중앙</button><button type="button" data-align="right">우측</button><select data-font-size aria-label="글자 크기"><option value="3">보통</option><option value="2">작게</option><option value="4">크게</option><option value="5">매우 크게</option></select><select data-line-height aria-label="행간"><option value="1.65">행간 1.65</option><option value="1.8">행간 1.8</option><option value="2">행간 2.0</option></select><select data-letter-spacing aria-label="자간"><option value="-0.015em">자간 기본</option><option value="0">자간 0</option><option value="0.02em">자간 넓게</option></select><label>이미지<input type="file" accept="image/jpeg,image/png,image/webp" data-editor-image></label><button type="button" data-command="removeFormat">서식 제거</button></div><div class="column-editor" data-column-editor contenteditable="true" data-placeholder="칼럼 본문을 작성해 주세요."></div></div><p class="column-editor-note">이미지는 최대 3장까지 등록할 수 있으며 자동으로 압축됩니다. 너무 큰 이미지는 저장 용량 때문에 제한될 수 있습니다.</p><textarea name="content" data-column-content hidden required></textarea></div><div class="column-form-actions"><a href="mypage.html#columns">취소</a><button type="button" data-save-draft>임시저장</button><button class="primary" type="submit">검토 요청</button></div><p class="column-notice" data-column-notice></p></form><section class="column-status" data-column-write-status><strong>작성 권한을 확인하고 있습니다.</strong></section></main><footer class="footer" data-footer></footer><script src="script.js"></script><script type="module" src="column-write.js?v=20260731-2"></script></body></html>
