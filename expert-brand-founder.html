<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>브랜드·비즈니스 컨설팅 — 오픈 예정 | AESOST</title>
  <meta name="description" content="AESOST 브랜드·비즈니스 커리어 컨설팅은 현재 준비 중입니다.">
  <link rel="stylesheet" href="styles.css?v=20260802-5">
  <style>
    .coming-soon-page{min-height:calc(100vh - var(--header));background:var(--deep)}
    .coming-soon-backdrop{position:fixed;inset:var(--header) 0 0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(10,10,12,.82);backdrop-filter:blur(14px)}
    .coming-soon-modal{width:min(100%,560px);padding:42px;border:1px solid var(--line);border-radius:22px;background:#1d1d20;box-shadow:0 28px 80px rgba(0,0,0,.42);text-align:left}
    .coming-soon-kicker{display:block;margin-bottom:24px;color:var(--blue2);font-size:11px;font-weight:800;letter-spacing:.13em}
    .coming-soon-modal h1{margin:0;font-size:clamp(34px,4vw,50px);line-height:1.12;letter-spacing:-.06em}
    .coming-soon-modal p{margin:22px 0 0;color:var(--muted);font-size:15px;line-height:1.8}
    .coming-soon-actions{display:flex;gap:10px;margin-top:34px}
    .coming-soon-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:10px;font-size:12px;font-weight:800}
    .coming-soon-actions .primary{background:var(--blue);color:#fff}
    .coming-soon-actions .secondary{border:1px solid var(--line);color:#ddd}
    @media(max-width:520px){.coming-soon-modal{padding:30px 24px}.coming-soon-actions{flex-direction:column}.coming-soon-actions a{width:100%}}
  </style>
</head>
<body>
  <header class="site-header" data-header></header>
  <main class="coming-soon-page" aria-hidden="true"></main>

  <section class="coming-soon-backdrop" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
    <div class="coming-soon-modal">
      <span class="coming-soon-kicker">AESOST CAREER CONSULTING</span>
      <h1 id="coming-soon-title">브랜드·비즈니스<br>컨설팅 오픈 예정</h1>
      <p>현재 더 좋은 컨설팅 경험을 제공하기 위해 프로그램과 컨설턴트 구성을 준비하고 있습니다. 오픈 이후 상세 프로필과 신청 방법을 안내드릴 예정입니다.</p>
      <div class="coming-soon-actions">
        <a class="primary" href="expert-feedback.html">커리어 컨설팅으로 돌아가기</a>
        <a class="secondary" href="index.html">홈으로 이동</a>
      </div>
    </div>
  </section>

  <footer class="footer" data-footer></footer>
  <script src="script.js?v=20260804-6"></script>
</body>
</html>
