<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칼럼니스트 신청 — WAVELAB</title><meta name="description" content="WAVELAB 칼럼니스트로 신청하고 자신의 경험과 관점을 나눠보세요."><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="column-system.css"></head><body><header class="site-header" data-header></header><main class="column-form-page shell"><section class="column-form-head"><p>COLUMNIST APPLICATION</p><h1>칼럼니스트 신청</h1><span>자신의 전문 분야와 경험을 바탕으로 웨이블랩 독자에게 나누고 싶은 이야기를 알려주세요. 승인 후 칼럼 작성 기능이 열립니다.</span></section><form class="column-form" data-columnist-form hidden><div class="column-form-row"><label><span>활동 이름</span><input name="penName" maxlength="30" required></label><label><span>전문 분야</span><input name="expertise" maxlength="80" placeholder="예: 브랜딩, UX, 개발, 창업" required></label></div><label><span>한 줄 소개</span><input name="bio" maxlength="160" required></label><label><span>작성하고 싶은 주제</span><textarea name="topics" maxlength="1000" required></textarea></label><label><span>포트폴리오 또는 기존 글 링크</span><input name="referenceUrl" type="url" placeholder="https://"></label><label><span>신청 동기</span><textarea name="motivation" maxlength="1500" required></textarea></label><div class="column-form-actions"><a href="column.html">취소</a><button class="primary" type="submit">신청하기</button></div><p class="column-notice" data-columnist-notice></p></form><section class="column-status" data-columnist-status><strong>로그인 정보를 확인하고 있습니다.</strong></section></main><footer class="footer" data-footer></footer><script src="script.js"></script><script type="module" src="columnist-apply.js"></script></body></html>
