<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 — AESOST</title>
  <meta name="description" content="에이소스트에 로그인하고 저장한 콘텐츠와 커리어 기록을 확인하세요.">
  <link rel="stylesheet" href="styles.css?v=20260802-5">
  <link rel="stylesheet" href="aesost-theme.css?v=20260804-3">
  <link rel="stylesheet" href="auth-aesost.css?v=20260805-1">
  <style>
    .auth-panel .auth-form{margin-top:0}
    .auth-panel .auth-divider{display:flex;align-items:center;gap:16px;margin:24px 0 16px;color:#79747f;font-size:12px;text-align:center}
    .auth-panel .auth-divider:before,.auth-panel .auth-divider:after{content:"";flex:1;height:1px;background:#3a3640}
    .auth-panel .social-login{display:block;margin:0}
    .auth-panel .social-login button{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:52px;padding:0 54px;border:1px solid #45414b;border-radius:12px;background:#242329;color:#f5f4f6;font-size:14px;font-weight:750;letter-spacing:-.015em;cursor:pointer;transition:border-color .2s ease,background .2s ease,transform .2s ease}
    .auth-panel .social-login button:hover{border-color:#706978;background:#29272e;transform:translateY(-1px)}
    .auth-panel .social-login button:disabled{cursor:wait;opacity:.72;transform:none}
    .auth-panel .google-icon{position:absolute;left:19px;top:50%;width:20px;height:20px;transform:translateY(-50%);flex:0 0 auto}
    .auth-panel .social-login button.is-loading .google-icon{opacity:.45}
    @media(max-width:560px){.auth-panel .auth-divider{margin:21px 0 14px}.auth-panel .social-login button{height:52px;padding-left:50px;padding-right:50px}.auth-panel .google-icon{left:17px}}
  </style>
</head>
<body class="auth-page">
  <header class="site-header" data-header></header>
  <main class="auth-main shell">
    <section class="auth-card">
      <div class="auth-visual" aria-hidden="true"><img src="aesost-symbol-3d.svg?v=20260802-1" alt=""></div>
      <a class="auth-brand" href="index.html" aria-label="AESOST 홈으로 이동"><img class="brand-logo" src="aesost-logo.svg?v=20260801-2" alt="AESOST"></a>
      <div class="auth-tabs"><button class="is-active" type="button" data-auth-tab="login">로그인</button><button type="button" data-auth-tab="signup">회원가입</button></div>

      <div class="auth-panel is-active" data-auth-panel="login">
        <h1>다시 만나 반가워요.</h1>
        <p>저장한 콘텐츠와 커리어 기록을 이어서 확인하세요.</p>

        <form class="auth-form" data-login-form>
          <label><span>이메일</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required></label>
          <label><span>비밀번호</span><input type="password" name="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required></label>
          <div class="auth-options"><label><input type="checkbox" name="remember"> 로그인 상태 유지</label><a href="#" data-reset-password>비밀번호 찾기</a></div>
          <button class="auth-submit" type="submit">로그인</button>
        </form>

        <div class="auth-divider"><span>또는</span></div>
        <div class="social-login">
          <button type="button" data-google-login>
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.963 10.706A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
              <path fill="#EA4335" d="M9 3.58c1.322 0 2.507.455 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
            </svg>
            <span data-google-label>Google로 계속하기</span>
          </button>
        </div>
      </div>

      <div class="auth-panel" data-auth-panel="signup">
        <h1>에이소스트를 시작해 보세요.</h1>
        <p>지식을 얻고, 관점을 기록하며, 자신의 커리어 자산을 쌓아보세요.</p>

        <form class="auth-form" data-signup-form>
          <label><span>이름</span><input type="text" name="name" placeholder="이름을 입력해 주세요" autocomplete="name" required></label>
          <label><span>이메일</span><input type="email" name="email" placeholder="name@example.com" autocomplete="email" required></label>
          <label><span>비밀번호</span><input type="password" name="password" placeholder="6자 이상 입력해 주세요" autocomplete="new-password" minlength="6" required></label>
          <label class="agreement"><input type="checkbox" name="agreement" required>이용약관과 개인정보처리방침에 동의합니다.</label>
          <button class="auth-submit" type="submit">회원가입</button>
        </form>

        <div class="auth-divider"><span>또는</span></div>
        <div class="social-login">
          <button type="button" data-google-login>
            <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.181l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/>
              <path fill="#FBBC05" d="M3.963 10.706A5.42 5.42 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/>
              <path fill="#EA4335" d="M9 3.58c1.322 0 2.507.455 3.441 1.346l2.581-2.581C13.463.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/>
            </svg>
            <span data-google-label>Google로 시작하기</span>
          </button>
        </div>
      </div>

      <p class="auth-notice" data-auth-notice>로그인 정보를 입력해 주세요.</p>
    </section>
  </main>
  <footer class="footer" data-footer></footer>
  <script src="script.js?v=20260804-6"></script>
  <script>
    (() => {
      const card = document.querySelector('.auth-card');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
      if (!card || reducedMotion || coarsePointer) return;

      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;

      const renderGlow = () => {
        const rect = card.getBoundingClientRect();
        const x = Math.max(0, Math.min(100, ((pointerX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((pointerY - rect.top) / rect.height) * 100));
        card.style.setProperty('--mouse-x', `${x}%`);
        card.style.setProperty('--mouse-y', `${y}%`);
        frame = 0;
      };

      card.addEventListener('pointerenter', () => card.classList.add('is-pointer-active'));
      card.addEventListener('pointermove', event => {
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (!frame) frame = requestAnimationFrame(renderGlow);
      });
      card.addEventListener('pointerleave', () => {
        card.classList.remove('is-pointer-active');
        card.style.setProperty('--mouse-x', '50%');
        card.style.setProperty('--mouse-y', '18%');
      });
    })();
  </script>
</body>
</html>
