name: Deploy AESOST
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current AESOST SEO
        run: node scripts/apply-seo.mjs
      - name: Remove legacy academy platform files
        run: node scripts/prune-legacy.mjs
      - name: Finalize current site runtime
        run: node scripts/finalize-current-site.mjs
      - name: Apply current site QA hardening
        run: node scripts/qa-current-site.mjs
      - name: Validate core site
        run: node scripts/validate-site.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
