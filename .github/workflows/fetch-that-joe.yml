name: Import That Joe reference images

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch-that-joe.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X theirs

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Import project images and update pages
        run: node scripts/fetch-that-joe.mjs

      - name: Commit imported images
        run: |
          git add assets/reference/that-joe reference-that-joe-pizza.html reference.html reference.css reference-source-images.css reference-source-images.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use local That Joe project images"
          fi
          git push
